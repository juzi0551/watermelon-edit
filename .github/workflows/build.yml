name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Debug - list installed packages
        shell: pwsh
        run: pip list

      - name: Bundle with PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "backend/app/data"
          pyinstaller --name "西瓜少年" --onedir --noconfirm --clean `
            --paths "backend" `
            --add-data "backend/static;backend/static" `
            --add-data "backend/app/data;backend/app/data" `
            --collect-all litellm --collect-all httpx --collect-all httpcore --collect-all h2 `
            --collect-all fastapi --collect-all starlette --collect-all pydantic `
            --collect-all uvicorn `
            --hidden-import app --hidden-import app.api --hidden-import app.core --hidden-import app.models --hidden-import app.utils `
            --hidden-import python_multipart --hidden-import jinja2.ext `
            run.py

      - name: Debug - list collected modules
        shell: pwsh
        run: Get-ChildItem -Recurse -Directory -Path "dist/西瓜少年/_internal" | Select-Object -ExpandProperty Name | Sort-Object

      - name: Prepare data files and compress artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/西瓜少年/data"
          Set-Content -Path "dist/西瓜少年/data/api_keys.json" -Value "{}"
          Compress-Archive -Path "dist/西瓜少年/*" -DestinationPath "dist/西瓜少年-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜少年-windows-exe
          path: dist/西瓜少年-windows.zip
          retention-days: 30


