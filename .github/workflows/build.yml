name: Build Windows EXE + Tauri Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python --version
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
          python -c "import fastapi; import starlette; import pydantic; import uvicorn; print('ALL OK:', fastapi.__version__)"

      - name: Bundle backend with PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "backend/app/data"
          pyinstaller --name "西瓜少年" --onefile --noconfirm --clean `
            --paths "backend" `
            --add-data "backend/app/data;backend/app/data" `
            --collect-all litellm --collect-all tiktoken --collect-all tiktoken_ext `
            --hidden-import tiktoken_ext.openai_public `
            --hidden-import fastapi --hidden-import starlette --hidden-import pydantic `
            --hidden-import app --hidden-import app.api --hidden-import app.core --hidden-import app.models --hidden-import app.utils `
            run.py

      - name: Setup Rust (for Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Copy backend exe to Tauri binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Copy-Item "dist/西瓜少年.exe" "src-tauri/binaries/西瓜少年-x86_64-pc-windows-msvc.exe" -Force

      - name: Build Tauri desktop app
        shell: pwsh
        run: npx --prefix frontend tauri build

      - name: Upload Tauri portable zip
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜审校-windows-portable
          path: src-tauri/target/release/*.zip
          retention-days: 30

      - name: Upload backend exe (standalone)
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜少年-windows-exe
          path: dist/西瓜少年.exe
          retention-days: 30
